name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every OS this ships to runs the suite: a path or terminal assumption should break a
    # build here rather than someone's install.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  catalog:
    # The catalog is the product. A rule that names an unregistered predicate, or a checksum
    # that no longer matches what the backend vendors, must fail here and not in someone's
    # cluster report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go run ./cmd/kube-upgrade-check catalog validate
      # Checks the catalog against facts read from the Kubernetes source, not from release
      # notes. This is what stops a wrong version silently shipping as a confident finding.
      - run: go test ./internal/catalog/groundtruth/ -v
      - name: Checksums are current
        run: |
          make checksums
          git diff --exit-code catalog/CHECKSUMS || {
            echo "::error::catalog/CHECKSUMS is stale — run 'make checksums' and commit the result"
            exit 1
          }

  build-matrix:
    # Proves all six release binaries still link, without publishing anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2.5"
          args: build --snapshot --clean
