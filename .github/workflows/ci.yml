name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every OS this ships to runs the suite: a path or terminal assumption should break a
    # build here rather than someone's install.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # Installed from source rather than downloaded. The prebuilt binaries are compiled with
      # whatever Go the release was cut with, and golangci-lint refuses to run when that is older
      # than the version a module targets — which is how this job failed on its first run, and how
      # it is still failing in the sibling CLI repository. Building it here uses the same
      # toolchain as the code under test, so the two cannot drift apart.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: golangci-lint run --timeout 5m

  catalog:
    # The catalog is the product. A rule that names an unregistered predicate, or a checksum
    # that no longer matches what the backend vendors, must fail here and not in someone's
    # cluster report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go run ./cmd/kube-upgrade-check catalog validate
      # Checks the catalog against facts read from the Kubernetes source, not from release
      # notes. This is what stops a wrong version silently shipping as a confident finding.
      - run: go test ./internal/catalog/groundtruth/ -v
      - name: Checksums are current
        run: |
          make checksums
          git diff --exit-code catalog/CHECKSUMS || {
            echo "::error::catalog/CHECKSUMS is stale — run 'make checksums' and commit the result"
            exit 1
          }

  build-matrix:
    # Proves all six release binaries still link, without publishing anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2.5"
          # `check` first: a config field the pinned version does not know fails the whole run
          # before anything is built, and finding that out from a tag means the release is
          # already burned. This catches it on the pull request instead.
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2.5"
          args: build --snapshot --clean
